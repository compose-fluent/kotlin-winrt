#Kotlin
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Full-SDK reference compilation must not share the Gradle/IDE model heap.
kotlin.daemon.jvmargs=-Xmx8192M -XX:+UseG1GC
kotlin.compiler.execution.strategy=daemon
# Keep full-SDK Native optimization out of the Gradle/IDE model heap.
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx8192M -XX:+UseG1GC
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlinx.atomicfu.enableNativeIrTransformation=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#WinRT project
# Base version used for SNAPSHOT builds; release version is read from the git tag (e.g. v0.1.0).
winrt.baseVersion=0.1.0
# Metadata baselines used for prebuilt projection artifacts.
kotlinWinRT.projections.windowsSdkVersion=10.0.26100.0
kotlinWinRT.projections.windowsSdkVersions=10.0.26100.0,10.0.22621.0,10.0.22000.0,10.0.19041.0
kotlinWinRT.projections.windowsAppSdkVersion=2.5.1
kotlinWinRT.projections.webView2Version=1.0.3719.77
