name: Publish Projections

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish projection artifacts to Maven Central'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publicationKind:
        description: 'Projection publication kind; snapshot appends the kotlin-winrt snapshot suffix, release uses metadata baseline artifact versions'
        required: true
        default: 'snapshot'
        type: choice
        options:
          - 'snapshot'
          - 'release'
      releaseTag:
        description: 'kotlin-winrt release tag used for release projection dependencies, for example v0.1.0; required when publicationKind is release'
        required: false
        default: ''
      windowsAppSdkVersion:
        description: 'Microsoft.WindowsAppSDK version used for the prebuilt projection'
        required: true
        default: '2.2.0'
      windowsSdkVersions:
        description: 'Comma-separated Windows SDK metadata versions to publish as windows-sdk projection versions'
        required: true
        default: '10.0.26100.0,10.0.22621.0,10.0.22000.0,10.0.19041.0'
      windowsAppSdkWindowsSdkVersion:
        description: 'Windows SDK projection version used by the Windows App SDK projection'
        required: true
        default: '10.0.26100.0'

permissions:
  contents: read

jobs:
  publish-projections:
    name: Publish Prebuilt Projections
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Windows SDK baselines
        shell: pwsh
        run: |
          $versions = @("${{ inputs.windowsSdkVersions }}".Split(",") + "${{ inputs.windowsAppSdkWindowsSdkVersion }}")
            | ForEach-Object { $_.Trim() }
            | Where-Object { $_ }
            | Select-Object -Unique
          ./.github/scripts/install-release-sdks.ps1 -Versions $versions

      - name: Normalize projection cache key
        id: projection-cache-key
        shell: pwsh
        run: |
          $windowsSdkVersions = "${{ inputs.windowsSdkVersions }}" -replace '[^A-Za-z0-9_.-]', '_'
          "windowsSdkVersions=$windowsSdkVersions" >> $env:GITHUB_OUTPUT

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~\.nuget\packages
            ~\.gradle\caches\kotlin-winrt\nuget
          key: nuget-${{ runner.os }}-Microsoft.WindowsAppSDK-${{ inputs.windowsAppSdkVersion }}-sdk-${{ steps.projection-cache-key.outputs.windowsSdkVersions }}-${{ inputs.windowsAppSdkWindowsSdkVersion }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure projection build memory
        shell: pwsh
        run: |
          # Kotlin compiles in-process, so the full SDK projection uses the Gradle heap.
          # Apply this to compilation AND publication (which can compile another SDK baseline).
          $gradleHome = if ($env:GRADLE_USER_HOME) { $env:GRADLE_USER_HOME } else { Join-Path $env:USERPROFILE ".gradle" }
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          @"

          org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          "@ | Add-Content -Path (Join-Path $gradleHome "gradle.properties") -Encoding utf8

      - name: Validate Publication Kind
        shell: pwsh
        run: |
          if ("${{ inputs.publicationKind }}" -eq "release" -and "${{ inputs.releaseTag }}" -notmatch '^v\d+\.\d+\.\d+(-.*)?$') {
            Write-Error "releaseTag must look like vX.Y.Z when publicationKind is release."
            exit 1
          }

      - name: Compile Projection Artifacts
        shell: pwsh
        run: |
          $releaseArgs = @()
          if ("${{ inputs.publicationKind }}" -eq "release") {
            $releaseArgs += "-Pwinrt.releaseTag=${{ inputs.releaseTag }}"
          }
          function Invoke-ProjectionCompile([string] $task, [string[]] $gradleArgs) {
            .\gradlew.bat `
              $task `
              $gradleArgs `
              --no-configuration-cache `
              --max-workers=1
            $exitCode = $LASTEXITCODE
            .\gradlew.bat --stop
            if ($exitCode -ne 0) { exit $exitCode }
          }
          $sdkVersions = @("${{ inputs.windowsSdkVersions }}".Split(",") + "${{ inputs.windowsAppSdkWindowsSdkVersion }}")
            | ForEach-Object { $_.Trim() }
            | Where-Object { $_ }
            | Select-Object -Unique
          foreach ($sdkVersion in $sdkVersions) {
            $sdkArgs = @("-PkotlinWinRT.projections.windowsSdkVersion=$sdkVersion") + $releaseArgs
            Invoke-ProjectionCompile ":winrt-projections:windows-sdk:compileKotlinJvm" $sdkArgs
            Invoke-ProjectionCompile ":winrt-projections:windows-sdk:compileKotlinMingwX64" $sdkArgs
            Invoke-ProjectionCompile ":winrt-projections:windows-ui-xaml:compileKotlinJvm" $sdkArgs
            Invoke-ProjectionCompile ":winrt-projections:windows-ui-xaml:compileKotlinMingwX64" $sdkArgs
          }
          $windowsAppSdkArgs = @(
            "-PkotlinWinRT.projections.windowsSdkVersion=${{ inputs.windowsAppSdkWindowsSdkVersion }}"
            "-PkotlinWinRT.projections.windowsAppSdkVersion=${{ inputs.windowsAppSdkVersion }}"
          ) + $releaseArgs
          Invoke-ProjectionCompile ":winrt-projections:windows-app-sdk:compileKotlinJvm" $windowsAppSdkArgs
          Invoke-ProjectionCompile ":winrt-projections:windows-app-sdk:compileKotlinMingwX64" $windowsAppSdkArgs

      - name: Verify Projection Publications Locally
        shell: pwsh
        run: |
          $releaseArgs = @()
          if ("${{ inputs.publicationKind }}" -eq "release") {
            $releaseArgs += "-Pwinrt.releaseTag=${{ inputs.releaseTag }}"
          }
          $sdkVersions = @("${{ inputs.windowsSdkVersions }}".Split(",") + "${{ inputs.windowsAppSdkWindowsSdkVersion }}")
            | ForEach-Object { $_.Trim() }
            | Where-Object { $_ }
            | Select-Object -Unique
          foreach ($sdkVersion in $sdkVersions) {
            .\gradlew.bat `
              :winrt-projections:windows-sdk:publishToMavenLocal `
              "-PkotlinWinRT.projections.windowsSdkVersion=$sdkVersion" `
              $releaseArgs `
              --no-configuration-cache
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\gradlew.bat `
              :winrt-projections:windows-ui-xaml:publishToMavenLocal `
              "-PkotlinWinRT.projections.windowsSdkVersion=$sdkVersion" `
              $releaseArgs `
              --no-configuration-cache
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          .\gradlew.bat `
            :winrt-projections:windows-app-sdk:publishToMavenLocal `
            "-PkotlinWinRT.projections.windowsSdkVersion=${{ inputs.windowsAppSdkWindowsSdkVersion }}" `
            "-PkotlinWinRT.projections.windowsAppSdkVersion=${{ inputs.windowsAppSdkVersion }}" `
            $releaseArgs `
            --no-configuration-cache

      - name: Check Maven Central secrets
        if: inputs.publish == 'true'
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY_ID: ${{ secrets.MAVEN_GPG_KEY_ID }}
          MAVEN_GPG_KEY_ARMOR: ${{ secrets.MAVEN_GPG_KEY_ARMOR }}
          MAVEN_GPG_KEY_PASSWORD: ${{ secrets.MAVEN_GPG_KEY_PASSWORD }}
        run: |
          missing=()
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_KEY_ID MAVEN_GPG_KEY_ARMOR MAVEN_GPG_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Publish Projection Artifacts
        if: inputs.publish == 'true'
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY_ARMOR }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_KEY_PASSWORD }}
        run: |
          $releaseArgs = @()
          if ("${{ inputs.publicationKind }}" -eq "release") {
            $releaseArgs += "-Pwinrt.releaseTag=${{ inputs.releaseTag }}"
          }
          $sdkVersions = @("${{ inputs.windowsSdkVersions }}".Split(",") + "${{ inputs.windowsAppSdkWindowsSdkVersion }}")
            | ForEach-Object { $_.Trim() }
            | Where-Object { $_ }
            | Select-Object -Unique
          foreach ($sdkVersion in $sdkVersions) {
            .\gradlew.bat `
              :winrt-projections:windows-sdk:publishAllPublicationsToMavenCentralRepository `
              "-PkotlinWinRT.projections.windowsSdkVersion=$sdkVersion" `
              $releaseArgs `
              --no-configuration-cache
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\gradlew.bat `
              :winrt-projections:windows-ui-xaml:publishAllPublicationsToMavenCentralRepository `
              "-PkotlinWinRT.projections.windowsSdkVersion=$sdkVersion" `
              $releaseArgs `
              --no-configuration-cache
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          .\gradlew.bat `
            :winrt-projections:windows-app-sdk:publishAllPublicationsToMavenCentralRepository `
            "-PkotlinWinRT.projections.windowsSdkVersion=${{ inputs.windowsAppSdkWindowsSdkVersion }}" `
            "-PkotlinWinRT.projections.windowsAppSdkVersion=${{ inputs.windowsAppSdkVersion }}" `
            $releaseArgs `
            --no-configuration-cache
