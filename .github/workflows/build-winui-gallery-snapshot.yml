name: Build WinUI Gallery Snapshot

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  push:
    branches:
      - master
      - xaml-support
      - codex/ci-snapshot-publish-test
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
  schedule:
    # Run every Sunday at 00:00 UTC.
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  build-gallery:
    name: Build and sign ${{ matrix.variant }} Gallery
    timeout-minutes: 360
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: winui3-jvm
            framework: '3'
            target: jvm
            task: signWinAppPackageWinuiJvmMain
            manifest: winui-gallery/src/winuiMain/appxResources/AppxManifest.xml
            build_dir: winui-gallery/build
            file_prefix: Kotlin-WinUI-Gallery
            artifact_suffix: jvm
          - variant: winui3-native
            framework: '3'
            target: mingwX64
            task: signWinAppPackageMingwX64MainReleaseExecutable
            manifest: winui-gallery/src/winuiMain/appxResources/AppxManifest.xml
            build_dir: winui-gallery/build
            file_prefix: Kotlin-WinUI-Gallery
            artifact_suffix: mingwX64
          - variant: uwp-native
            framework: '2'
            target: mingwX64
            task: signWinAppPackageMingwX64MainReleaseExecutable
            manifest: winui-gallery/src/uwpMain/AppxManifest.xml
            build_dir: winui-gallery/build/winui2
            file_prefix: Kotlin-UWP-Gallery
            artifact_suffix: uwp-mingwX64
    env:
      GALLERY_MANIFEST: ${{ matrix.manifest }}
      GALLERY_FRAMEWORK: ${{ matrix.framework }}
      GALLERY_TARGET: ${{ matrix.target }}
      GALLERY_TASK: ${{ matrix.task }}
      GALLERY_BUILD_DIR: ${{ matrix.build_dir }}
      GALLERY_FILE_PREFIX: ${{ matrix.file_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~\.nuget\packages
            ~\.gradle\caches\kotlin-winrt\nuget
          key: nuget-${{ runner.os }}-Microsoft.WindowsAppSDK-2.5.1
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Windows SDK 10.0.26100.0
        shell: pwsh
        run: |
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $sdkVersion = '10.0.26100.0'
          $referencePath = Join-Path $sdkRoot "References\$sdkVersion"
          $toolPath = Join-Path $sdkRoot "bin\$sdkVersion\x64"
          if (-not (Test-Path $referencePath)) {
            throw "Windows SDK $sdkVersion was not found at $referencePath."
          }
          foreach ($tool in @('makeappx.exe', 'makepri.exe', 'signtool.exe')) {
            if (-not (Test-Path (Join-Path $toolPath $tool))) {
              throw "Windows SDK tool $tool was not found under $toolPath."
            }
          }
          if ($env:GALLERY_FRAMEWORK -eq '2') {
            $genXbfPaths = @(
              (Join-Path $sdkRoot "bin\$sdkVersion\XamlCompiler\x64\GenXbf.dll"),
              (Join-Path $toolPath 'GenXbf.dll')
            )
            if (-not ($genXbfPaths | Where-Object { Test-Path -LiteralPath $_ })) {
              throw "UWP requires the Windows SDK XAML compiler tools: $($genXbfPaths -join ', ')"
            }
          }

      - name: Set package identity and version
        id: package-meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $baseVersionLine = Get-Content 'gradle.properties' |
            Where-Object { $_ -cmatch '^\s*winrt\.baseVersion\s*=' } |
            Select-Object -First 1
          $baseVersion = if ($baseVersionLine) {
            ($baseVersionLine -split '=', 2)[1].Trim()
          } else {
            '0.1.0'
          }

          $kind = 'snapshot'
          $packageVersion = "$baseVersion-SNAPSHOT"
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -cnotmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected release tag vX.Y.Z.' }
            $packageVersion = $Matches[1]
            $kind = 'release'
          }
          "kind=$kind" >> $env:GITHUB_OUTPUT
          $fileVersion = $packageVersion -replace '[^A-Za-z0-9._-]', '-'
          if ([string]::IsNullOrWhiteSpace($fileVersion)) {
            throw 'Resolved an empty Gallery package version.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "WINUI_GALLERY_PACKAGE_VERSION=$fileVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$fileVersion"

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE $env:GALLERY_MANIFEST
          [xml]$manifest = Get-Content -Raw $manifestPath
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ($null -eq $identity) {
            throw "Could not find Package/Identity in $manifestPath."
          }
          $baseName = $identity.GetAttribute('Name') -replace '(?i)\.snapshot$', ''
          $snapshotName = if ($kind -eq 'release') { $baseName } else { "$baseName.snapshot" }
          if ($kind -eq 'release') { $identity.SetAttribute('Version', "$packageVersion.0") }
          if ($snapshotName.Length -gt 50 -or $snapshotName -cnotmatch '^[A-Za-z0-9.-]+$') {
            throw "Snapshot package identity name is invalid: $snapshotName"
          }
          $identity.SetAttribute('Name', $snapshotName)
          $manifest.Save($manifestPath)
          Write-Host "Snapshot identity: $snapshotName; versioned package filename version: $fileVersion"

      - name: Import snapshot signing certificate
        shell: pwsh
        env:
          WINUI_GALLERY_SIGNING_PFX_BASE64: ${{ secrets.WINUI_GALLERY_SIGNING_PFX_BASE64 }}
          WINUI_GALLERY_SIGNING_PFX_PASSWORD: ${{ secrets.WINUI_GALLERY_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINUI_GALLERY_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINUI_GALLERY_SIGNING_PFX_PASSWORD)) {
            throw 'Set the WINUI_GALLERY_SIGNING_PFX_BASE64 and WINUI_GALLERY_SIGNING_PFX_PASSWORD repository secrets.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'winui-gallery-snapshot-signing.pfx'
          $pfxBase64 = $env:WINUI_GALLERY_SIGNING_PFX_BASE64 -replace '\s', ''
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxBase64))
          $pfxPassword = ConvertTo-SecureString $env:WINUI_GALLERY_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $pfxPassword
          $privateCertificates = @($imported | Where-Object { $_.HasPrivateKey })
          if ($privateCertificates.Count -ne 1) {
            throw "Expected one signing certificate with a private key in the PFX; found $($privateCertificates.Count)."
          }
          $certificate = $privateCertificates[0]
          Add-Content -Path $env:GITHUB_ENV -Value "WINUI_GALLERY_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)"

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE $env:GALLERY_MANIFEST
          [xml]$manifest = Get-Content -Raw $manifestPath
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          $publisher = $identity.GetAttribute('Publisher')
          if ($certificate.Subject -cne $publisher) {
            throw "Signing certificate Subject '$($certificate.Subject)' must exactly match package Publisher '$publisher'."
          }
          if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
            throw 'The Gallery signing certificate has expired.'
          }

          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'winui-gallery-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "WINUI_GALLERY_SIGNING_PUBLIC_CERTIFICATE=$publicCertificatePath"

      - name: Build and sign Gallery package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Standalone/manual runs stay snapshots; the release caller supplies an explicit tag.
          $env:GITHUB_REF_TYPE = 'branch'
          $packageRoot = Join-Path (Join-Path $env:GITHUB_WORKSPACE $env:GALLERY_BUILD_DIR) 'kotlin-winrt/packages'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'winui-gallery-snapshot-artifacts'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $galleryOptions = @('--no-daemon', '--no-configuration-cache', '--max-workers=1',
            "-PkotlinWinRT.gallery.winuiVersion=$env:GALLERY_FRAMEWORK")
          if ($env:RELEASE_TAG) { $galleryOptions += "-Pwinrt.releaseTag=$env:RELEASE_TAG" }
          if ($env:GALLERY_TARGET -eq 'jvm') {
            $galleryOptions += '-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseSerialGC -Dfile.encoding=UTF-8'
          } else {
            # Preserve Native Release optimizations. Keep the compiler heap separate
            # from Gradle and return idle heap to leave room for LLVM allocations.
            $galleryOptions += @(
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:+UseSerialGC -Dfile.encoding=UTF-8',
              '-Pkotlin.native.disableCompilerDaemon=true',
              '-Pkotlin.native.jvmArgs=-Xmx12g -XX:+UseG1GC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:G1PeriodicGCInterval=30000')
          }
          & .\gradlew.bat ":winui-gallery:$env:GALLERY_TASK" @galleryOptions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signedPackages = @(Get-ChildItem -Path $packageRoot -Filter '*-signed.msix' -File -Recurse)
          if ($signedPackages.Count -ne 1) {
            throw "Expected one signed Gallery package; found $($signedPackages.Count) under $packageRoot."
          }
          $fileName = '{0}-{1}-{2}.msix' -f $env:GALLERY_FILE_PREFIX, $env:WINUI_GALLERY_PACKAGE_VERSION, $env:GALLERY_TARGET
          Copy-Item $signedPackages[0].FullName (Join-Path $artifactRoot $fileName)
          Copy-Item $env:WINUI_GALLERY_SIGNING_PUBLIC_CERTIFICATE (Join-Path $artifactRoot 'winui-gallery-signing.cer')

      - name: Upload Gallery package
        uses: actions/upload-artifact@v4
        with:
          name: winui-gallery-${{ steps.package-meta.outputs.kind }}-${{ steps.package-meta.outputs.version }}-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/winui-gallery-snapshot-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:WINUI_GALLERY_SIGNING_CERTIFICATE_THUMBPRINT
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            Get-ChildItem 'Cert:\CurrentUser\My' |
              Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'winui-gallery-snapshot-signing.pfx') -Force -ErrorAction SilentlyContinue
