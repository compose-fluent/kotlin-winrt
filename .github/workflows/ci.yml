name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    # windows-2022 uses Windows Server 2022 and is the closest GitHub-hosted runner for
    # testing Windows 10/11 API compatibility on x64.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 for inactive plugin compatibility
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Windows SDK 10.0.22621.0
        shell: pwsh
        run: ./.github/scripts/install-release-sdks.ps1 -Versions @('10.0.22621.0')

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          # Cache the NuGet global packages folder so Microsoft.WindowsAppSDK is not
          # re-downloaded on every run, and the nuget.exe binary cached by the build script.
          path: |
            ~\.nuget\packages
            ~\.gradle\caches\kotlin-winrt\nuget
          key: nuget-${{ runner.os }}-Microsoft.WindowsAppSDK-2.5.1
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          ./gradlew \
            :winrt-runtime:assemble \
            :winrt-metadata:assemble \
            :winrt-generator:assemble \
            :winrt-authoring:assemble \
            :winrt-compiler-plugin:assemble \
            :winrt-compiler-plugin:compiler-kotlin-2-4-20:assemble \
            :winrt-projections:assemble \
            :winrt-samples:assemble \
            --no-configuration-cache

      - name: Test
        # Pass winmd.nugetComponents so that:
        #   - :generated-winrt-bindings:restoreNuGetWinMdPackages restores Microsoft.WindowsAppSDK
        #   - :sample-jvm-winui3:collectWinUIRuntimeAssets stages the runtime DLLs for tests
        # WINDOWS_KITS_10_DIR lets WindowsSdkReferences.discoverReferencesRoot() find the SDK
        # installed by the step above through the env-var fallback path.
        shell: bash
        env:
          WINDOWS_KITS_10_DIR: C:\Program Files (x86)\Windows Kits\10
          KOTLIN_WINRT_WINDOWS_WINMD: C:\Program Files (x86)\Windows Kits\10\UnionMetadata\10.0.22621.0\Windows.winmd
        run: |
          ./gradlew \
            :winrt-runtime:jvmTest \
            :winrt-runtime:mingwX64Test \
            :winrt-metadata:test \
            :winrt-generator:test \
            :winrt-authoring:jvmTest \
            :winrt-authoring:mingwX64Test \
            :winrt-compiler-plugin:test \
            :winrt-compiler-plugin:compiler-kotlin-2-4-20:test \
            :winrt-compiler-plugin:callsite-lowering:test \
            :winrt-compiler-plugin:callsite-lowering:lowering-kotlin-2-4-20:test \
            :winrt-projections:jvmTest \
            :winrt-projections:mingwX64Test \
            :winrt-samples:winuiJvmTest \
            :winrt-samples:mingwX64Test \
            -Pwinmd.nugetComponents=Microsoft.WindowsAppSDK@2.5.1 \
            --no-configuration-cache

      - name: Test Kotlin compiler compatibility
        shell: pwsh
        env:
          WINRT_TEST_JDK_21: ${{ steps.jdk21.outputs.path }}
        run: ./gradlew.bat -p windows-toolkit-gradle-plugin :compilerCompatibilityTest --no-configuration-cache --max-workers=2
