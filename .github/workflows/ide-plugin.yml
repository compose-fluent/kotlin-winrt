name: IDE Plugin

on:
  workflow_call:
    inputs:
      project_release_tag:
        required: true
        type: string
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches: [master]
    tags: ['ide-v*']
    paths-ignore:
      - '**/*.md'
      - LICENSE
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing ide-vX.Y.Z tag to publish; leave empty to build snapshot artifacts only'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ide-plugin-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.release_tag }}

jobs:
  prepare:
    name: Select plugin version
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release tag or snapshot
        id: version
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PROJECT_RELEASE_TAG: ${{ inputs.project_release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:INPUT_RELEASE_TAG
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          $commit = git rev-parse HEAD
          if ($env:PROJECT_RELEASE_TAG) {
            $tag = $env:PROJECT_RELEASE_TAG
            if ($tag -cnotmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected project tag vX.Y.Z.' }
            $version = $Matches[1]
            $tagCommit = git rev-parse --verify "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $commit) { throw 'Release tag must match checkout.' }
            $publish = 'false'
          } elseif ($tag) {
            if ($tag -cnotmatch '^ide-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw 'Release tags must use ide-vX.Y.Z, optionally with a prerelease suffix.'
            }
            $version = $Matches[1]
            $commit = git rev-parse --verify "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "The release tag does not exist: $tag" }
            $publish = 'true'
          } else {
            $base = (Select-String -Path 'gradle.properties' -Pattern '^winrt.baseVersion=(.+)$').Matches.Groups[1].Value
            if ($base -cnotmatch '^\d+\.\d+\.\d+$') { throw 'winrt.baseVersion must be a three-part version.' }
            $version = "$base-SNAPSHOT"
            $publish = 'false'
          }
          "version=$version", "commit=$commit", "tag=$tag", "publish=$publish" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT

  build:
    name: Test and package ${{ matrix.variant }}
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: idea-262
            sdk-version: '2026.2.2'
          - variant: as-261
            sdk-version: '2026.1.4.7'
          - variant: as-canary-262
            sdk-version: '2026.2.2.2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: ide-plugin-konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'winrt-runtime/src/nativeInterop/**') }}
      - name: Run IDE tests and verify installable distribution
        shell: pwsh
        env:
          IDE_VARIANT: ${{ matrix.variant }}
          IDE_SDK_VERSION: ${{ matrix.sdk-version }}
          IDE_PLUGIN_VERSION: ${{ needs.prepare.outputs.version }}
          PROJECT_RELEASE_TAG: ${{ inputs.project_release_tag }}
        run: |
          $releaseOptions = @{}
          if ($env:PROJECT_RELEASE_TAG) { $releaseOptions.ReleaseTag = $env:PROJECT_RELEASE_TAG }
          ./.github/scripts/build-ide-plugin.ps1 @releaseOptions `
            -Variant $env:IDE_VARIANT -SdkVersion $env:IDE_SDK_VERSION `
            -Version $env:IDE_PLUGIN_VERSION -OutputDirectory "$env:RUNNER_TEMP/ide-plugin"
      - name: Upload plugin ZIP, checksum and build metadata
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ide-plugin-${{ matrix.variant }}-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/ide-plugin/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload IDE test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ide-plugin-tests-${{ matrix.variant }}
          path: |
            winrt-compiler-plugin/ide/build/variants/${{ matrix.variant }}/reports/tests/
            winrt-compiler-plugin/ide/build/variants/${{ matrix.variant }}/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ide-plugin-*-${{ needs.prepare.outputs.version }}
          path: packages
          merge-multiple: true
      - name: Verify packages and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $variants = @('idea-262', 'as-261', 'as-canary-262')
          $checksums = foreach ($variant in $variants) {
            $metadata = Get-Content -LiteralPath "packages/$variant.json" -Raw | ConvertFrom-Json
            $expectedFile = "kotlin-winrt-ide-$env:RELEASE_VERSION-$variant.zip"
            if ($metadata.variant -cne $variant -or $metadata.pluginVersion -cne $env:RELEASE_VERSION -or
                $metadata.commit -cne $env:RELEASE_COMMIT -or $metadata.file -cne $expectedFile) {
              throw "Artifact provenance does not match the release: $variant"
            }
            $actual = (Get-FileHash -LiteralPath "packages/$expectedFile" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $metadata.sha256) { throw "Checksum mismatch: $expectedFile" }
            "$actual  $expectedFile"
          }
          $checksums | Set-Content -LiteralPath 'packages/SHA256SUMS.txt' -Encoding utf8NoBOM
          @"
          Kotlin WinRT IDE Plugin $env:RELEASE_VERSION

          | Package | Validated IDE SDK |
          | --- | --- |
          | idea-262 | IntelliJ IDEA 2026.2.2 |
          | as-261 | Android Studio Quail 4 / 2026.1.4.7 |
          | as-canary-262 | Android Studio Rabbit 2 Canary 2 / 2026.2.2.2 |

          Install the matching ZIP through Settings > Plugins > Install Plugin from Disk.
          Each package includes the project toolchain and default application icons.
          XAML Preview is temporarily disabled. JVM Run/Debug enables Hot Reload by default;
          Native Hot Reload transport is not yet supported.

          Source commit: $env:RELEASE_COMMIT. SHA256SUMS.txt verifies all three ZIPs.
          "@ | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8NoBOM
          $assets = @($variants | ForEach-Object { "packages/kotlin-winrt-ide-$env:RELEASE_VERSION-$_.zip" })
          $assets += 'packages/SHA256SUMS.txt'
          $options = @('--repo', $env:GH_REPO, '--verify-tag', '--title', "Kotlin WinRT IDE Plugin $env:RELEASE_VERSION",
            '--notes-file', 'release-notes.md')
          if ($env:RELEASE_VERSION.Contains('-')) { $options += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets @options
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed (exit $LASTEXITCODE)." }
